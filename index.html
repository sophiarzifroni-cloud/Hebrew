<title>Kesher Hebrew</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow study column; sticky tab bar; the Hebrew word is always the biggest thing on screen. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #16202e;
  --muted: #5d6878;
  --line: #dde2ea;
  --accent: #1d4f91;      /* tekhelet blue */
  --accent-soft: #e3ecf8;
  --mark: #f2b632;        /* highlight for your words */
  --mark-soft: #fdf1d3;
  --good: #1f7a4d;
  --good-soft: #e1f3e9;
  --bad: #b3361f;
  --bad-soft: #fbe5e0;
  --font-ui: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-he: "Frank Ruhl Libre", "David", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141c; --surface: #18202c; --ink: #e8edf4; --muted: #98a3b3; --line: #2a3443;
    --accent: #7fb0f0; --accent-soft: #1f3150; --mark: #f2b632; --mark-soft: #3d3218;
    --good: #5cc790; --good-soft: #163527; --bad: #f08a72; --bad-soft: #3d1f19; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141c; --surface: #18202c; --ink: #e8edf4; --muted: #98a3b3; --line: #2a3443;
  --accent: #7fb0f0; --accent-soft: #1f3150; --mark: #f2b632; --mark-soft: #3d3218;
  --good: #5cc790; --good-soft: #163527; --bad: #f08a72; --bad-soft: #3d1f19; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.he { font-family: var(--font-he); direction: rtl; unicode-bidi: isolate; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.top-inner, main {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-inner { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 12px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand .he { font-size: 26px; font-weight: 700; color: var(--accent); }
.brand span:last-child { font-weight: 600; letter-spacing: .02em; }
.stats { display: flex; gap: 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
nav.tabs { display: flex; gap: 4px; width: 100%; }
nav.tabs button {
  flex: 1; background: none; border: none; padding: 10px 4px 12px; color: var(--muted); white-space: nowrap;
  font-weight: 500; border-bottom: 3px solid transparent;
}
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
@media (max-width: 440px) { nav.tabs button { font-size: 14px; } }

main { padding-block: 24px 64px; display: flex; flex-direction: column; gap: 20px; }
h2 { font-size: 18px; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.btn {
  border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; font-weight: 500;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: none; background: var(--surface); padding: 7px 12px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
label.lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: block; margin-bottom: 4px; }
input[type=text], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 11px;
}
textarea { min-height: 110px; resize: vertical; }
.note { font-size: 13px; color: var(--muted); }
.banner { background: var(--mark-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; }

/* Flashcard */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  min-height: 280px; padding: 28px 20px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; gap: 10px; cursor: pointer;
  box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px rgba(20, 40, 80, .35);
}
.card .big.he { font-size: clamp(44px, 12vw, 72px); line-height: 1.15; }
.card .big.en { font-size: clamp(26px, 7vw, 36px); font-weight: 500; }
.card .tr { color: var(--muted); font-style: italic; }
.card .hint { font-size: 13px; color: var(--muted); }
.card .back { display: flex; flex-direction: column; gap: 6px; align-items: center; border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 6px; width: 100%; }
.card .back .he { font-size: 34px; }
.card .back .en { font-size: 20px; }
.card .pos { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.progress { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .25s; }
.answer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.answer-row .btn { padding: 13px; font-size: 16px; }
kbd { font-family: inherit; font-size: 11px; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; opacity: .7; margin-left: 6px; }
.speak { background: none; border: 1px solid var(--line); border-radius: 50%; width: 36px; height: 36px; display: inline-grid; place-items: center; color: var(--accent); }
.speak svg { width: 18px; height: 18px; }

/* Sentences */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 4px 10px; font-size: 14px; display: inline-flex; gap: 6px; align-items: baseline; }
.chip .he { font-size: 17px; }
.chip[aria-pressed="true"] { background: var(--mark-soft); border-color: var(--mark); }
.sentence { display: flex; flex-direction: column; gap: 8px; padding-block: 16px; border-bottom: 1px solid var(--line); }
.sentence:last-child { border-bottom: none; }
.sentence .line { display: flex; gap: 12px; align-items: flex-start; }
.sentence .line .he { font-size: 26px; line-height: 1.6; flex: 1; min-width: 0; text-align: right; }
.sentence mark { background: var(--mark-soft); color: inherit; border-bottom: 2px solid var(--mark); padding: 0 2px; border-radius: 3px; }
.sentence .blank { display: inline-block; min-width: 3.2em; border-bottom: 2px solid var(--accent); }
.sentence .reveal { display: flex; flex-direction: column; gap: 2px; }
.sentence .reveal .tr { color: var(--muted); font-style: italic; font-size: 14px; }
.sentence .gram { font-size: 13px; color: var(--muted); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; direction: rtl; }
.opts button { font-family: var(--font-he); font-size: 20px; padding: 4px 14px; }
.opts button.right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.opts button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }

/* Word list */
.wordlist { display: flex; flex-direction: column; }
.word { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.word:last-child { border-bottom: none; }
.word .main { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; min-width: 0; }
.word .main .he { font-size: 24px; }
.word .main .tr { color: var(--muted); font-style: italic; font-size: 14px; }
.word .acts { display: flex; gap: 6px; align-items: center; }
.boxes { display: inline-flex; gap: 3px; }
.boxes i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.boxes i.on { background: var(--good); }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); padding: 0 6px; border-radius: 4px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
details summary { cursor: pointer; color: var(--accent); font-weight: 500; }
/* Voice capture */
.voice { display: flex; flex-direction: column; gap: 12px; }
.voice-head { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.mic {
  width: 64px; height: 64px; border-radius: 50%; border: none; flex: none;
  background: var(--accent); color: var(--surface); display: grid; place-items: center;
  box-shadow: 0 6px 18px -8px var(--accent);
}
.mic svg { width: 28px; height: 28px; }
.mic.live { background: var(--bad); box-shadow: 0 0 0 6px var(--bad-soft); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 12px var(--bad-soft); } }
.voice-head .say { flex: 1; min-width: 200px; }
.voice-head .say b { display: block; font-size: 16px; }
.partial { color: var(--muted); font-style: italic; min-height: 1.5em; font-size: 14px; }
.preview { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.preview label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.preview label:last-child { border-bottom: none; }
.preview .pv { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; min-width: 0; }
.preview .pv .he { font-size: 22px; }
.preview .pv .tr { color: var(--muted); font-style: italic; font-size: 14px; }
.preview .dup { opacity: .55; }
.hmic { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; color: var(--accent); border-color: var(--accent); }
.hmic svg { width: 16px; height: 16px; }
.mic.off { background: var(--muted); box-shadow: none; }
.interests { border-top: 1px solid var(--line); padding-top: 12px; }
.interests .chip { padding: 0; overflow: hidden; }
.chip-btn { border: none; background: none; padding: 4px 4px 4px 12px; font-size: 14px; }
.chip[aria-pressed="false"] .chip-btn { text-decoration: line-through; color: var(--muted); }
.chip-x { border: none; background: none; padding: 4px 10px 4px 4px; color: var(--muted); font-size: 16px; line-height: 1; }
.story-title { margin: 0 0 4px; font-size: 17px; }
.topic { align-self: flex-start; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.scan { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.scan-text b { display: block; }
.scan label.btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.scan label.btn svg { width: 18px; height: 18px; color: var(--accent); }
.scan label.btn.disabled { opacity: .5; pointer-events: none; }
.scan label.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Verbs */
.picker { display: flex; flex-direction: column; gap: 10px; }
.pgroup { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.btype { display: flex; flex-direction: column; gap: 12px; }
.btype h2 .he { font-size: 26px; color: var(--accent); margin-left: 6px; }
.ttable { overflow-x: auto; }
.ttable table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.gzhead { display: flex; flex-direction: column; gap: 4px; background: var(--bg); border-radius: 8px; padding: 10px; margin-top: 4px; }
.gzhead .he { font-size: 16px; }
.ttable th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; padding: 4px 6px; white-space: nowrap; }
.ttable td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.ttable td .he { font-size: 19px; display: block; }
.ttable td .tr { color: var(--muted); font-style: italic; font-size: 12px; display: block; }
.ttable th { white-space: normal; }
@media (max-width: 480px) { .btype.panel { padding: 12px 10px; } .ttable td .he { font-size: 17px; } }
.ttable td .en { font-size: 12px; color: var(--muted); }
.ttable tr.pat td { background: var(--accent-soft); }
.ttable tr.pat .he { color: var(--accent); }
.ttable tr.gz td { background: var(--bg); padding-block: 10px; }
.ttable input[type=checkbox] { width: 18px; height: 18px; margin-top: 4px; }
.ctable h3 { margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.ctable-scroll { overflow-x: auto; }
.ctable table { width: 100%; border-collapse: collapse; }
.ctable td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
.ctable td.pron { font-size: 16px; color: var(--muted); white-space: nowrap; }
.ctable td.form { font-size: 24px; white-space: nowrap; }
.ctable td .tr { color: var(--muted); font-style: italic; }
.ctable td.en { font-size: 14px; width: 100%; }
@media (max-width: 480px) { .ctable td.pron { font-size: 13px; white-space: normal; } .ctable td.form { font-size: 21px; } .ctable td { padding: 7px 4px; } }
.quiz { display: flex; flex-direction: column; gap: 14px; align-items: center; text-align: center; }
.quiz .pos { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.card .pos { font-size: 12px; }
/* Listening */
.listen { display: flex; flex-direction: column; gap: 16px; }
.player { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 8px; }
.play {
  width: 84px; height: 84px; border-radius: 50%; border: none; background: var(--accent); color: var(--surface);
  display: grid; place-items: center; box-shadow: 0 8px 24px -10px var(--accent);
}
.play svg { width: 36px; height: 36px; margin-left: 4px; }
.play:active { transform: scale(.96); }
.listen-he { font-size: 28px; line-height: 1.6; text-align: center; }
.listen-he mark { background: var(--mark-soft); color: inherit; border-bottom: 2px solid var(--mark); padding: 0 2px; border-radius: 3px; }
.listen .reveal { text-align: center; display: flex; flex-direction: column; gap: 2px; }
.listen .reveal .tr { color: var(--muted); font-style: italic; }
.listen .gram { font-size: 13px; color: var(--muted); }
.answer-box { display: flex; gap: 10px; align-items: flex-start; }
.answer-box textarea { min-height: 80px; flex: 1; min-width: 0; }
.mic.small-mic { width: 48px; height: 48px; }
.mic.small-mic svg { width: 22px; height: 22px; }
.verdict { align-self: flex-start; font-weight: 600; padding: 4px 12px; border-radius: 999px; font-size: 14px; }
.verdict.right { background: var(--good-soft); color: var(--good); }
.verdict.close { background: var(--mark-soft); color: var(--ink); }
.verdict.wrong { background: var(--bad-soft); color: var(--bad); }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); }
.empty .he { font-size: 40px; color: var(--ink); display: block; margin-bottom: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand"><span class="he" lang="he">קֶשֶׁר</span><span>Kesher</span></div>
    <div class="stats" id="stats"></div>
    <button class="btn hmic" data-act="hmic" aria-label="Add words by voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v5"/></svg>Add words</button>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="cards" aria-selected="true">Flashcards</button>
      <button role="tab" data-tab="sentences" aria-selected="false">Sentences</button>
      <button role="tab" data-tab="listen" aria-selected="false">Listening</button>
      <button role="tab" data-tab="verbs" aria-selected="false">Verbs</button>
      <button role="tab" data-tab="words" aria-selected="false">My words</button>
    </nav>
  </div>
</header>

<main id="main"></main>

<script>
(() => {
const DAY = 86400000;
const INTERVALS = { 1: 10 * 60000, 2: DAY, 3: 3 * DAY, 4: 7 * DAY, 5: 16 * DAY };
const SPEAK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';

const S = {
  words: [], loaded: false, mode: "local", db: null, sample: null, tts: null,
  tab: "cards", dir: "he-en",
  session: null,         // {queue, done, right, flipped}
  sent: { level: "beginner", focus: "due", picked: new Set(), items: [], mode: "read", busy: false, error: "" },
  confirmDel: null, filter: "",
  dict: null, dictTarget: "voice", dictState: "idle", listenPartial: "",
  webVoice: null, heWarn: false, lastTitle: "", vowelPending: new Set(), vowelErr: "",
  nikud: true,
  conj: {}, conjPending: new Set(), conjErr: "",
  verb: { selAll: true, sel: new Set(), openPicker: false, mode: "types", tenses: new Set(["present", "past", "future"]), num: "all", gen: "all", dir: "make", session: null, quiz: null, sent: { items: [], busy: false, error: "", mode: "read", title: "" } },
  prefs: { topics: [], off: [], about: "", story: true }, prefsDoc: false,
  listen: { items: [], i: 0, focus: "due", busy: false, checking: false, error: "", right: 0, close: 0 },
  voice: { text: "", partial: "", state: "idle", lang: "en", busy: false, items: [], error: "", msg: "" },
};
const MIC_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v5"/></svg>';
const DEFAULT_TOPICS = ["the environment", "animals", "veganism", "technology", "nature", "hiking", "travel", "different countries", "yummy vegan food", "politics and world issues", "Israeli policy and issues"];
const CAM_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-3h6l2 3h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>';
const IMG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>';
const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>';
const STOP_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const strip = (s) => String(s ?? "").replace(/[֑-ׇ]/g, "");
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 10);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

/* ---------- storage ---------- */
const store = {
  async put(w) {
    if (S.mode === "db") return S.db.collection("words").doc(w.id).set(clean(w));
    S.words = S.words.filter(x => x.id !== w.id).concat(w); saveLocal();
  },
  async patch(id, p) {
    if (S.mode === "db") return S.db.collection("words").doc(id).update(p);
    const w = S.words.find(x => x.id === id); if (w) Object.assign(w, p); saveLocal();
  },
  async remove(id) {
    if (S.mode === "db") return S.db.collection("words").doc(id).delete();
    S.words = S.words.filter(x => x.id !== id); saveLocal();
  },
};
function clean(w) { const o = { ...w }; delete o.id; return o; }
function saveLocal() { ls.set("kesher-words", S.words); render(); }

async function boot() {
  const vs = ls.get("kesher-verbsel"); if (vs && typeof vs.all === "boolean") { S.verb.selAll = vs.all; S.verb.sel = new Set(Array.isArray(vs.ids) ? vs.ids : []); }
  const nk = ls.get("kesher-nikud"); if (typeof nk === "boolean") S.nikud = nk;
  const pref = ls.get("kesher-prefs"); if (pref?.dir) S.dir = pref.dir; if (pref?.level) S.sent.level = pref.level;
  render();
  const use = window.claude?.use?.bind(window.claude);
  const [db, sample, tts, dict] = use ? await Promise.all([use("db"), use("sample"), use("tts"), use("dictation")].map(p => p.catch(() => null))) : [null, null, null, null];
  S.sample = sample; S.tts = tts;
  if (dict) setupDictation(dict);
  setupAudio();
  S.prefs.topics = DEFAULT_TOPICS.slice();
  const lp = ls.get("kesher-interests"); if (lp) Object.assign(S.prefs, lp);
  if (db) db.collection("conj").onSnapshot(snap => {
    S.conj = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    if (!snap.metadata.fromCache) S.conjLoaded = true;
    render(); sweepConj();
  }, () => {});
  else { S.conj = ls.get("kesher-conj") || {}; S.conjLoaded = true; sweepConj(); }
  if (db) db.doc("settings/profile").onSnapshot(snap => {
    if (snap.exists) { const d = snap.data(); S.prefsDoc = true; Object.assign(S.prefs, { topics: Array.isArray(d.topics) ? d.topics : S.prefs.topics, off: Array.isArray(d.off) ? d.off : [], about: typeof d.about === "string" ? d.about : "", story: d.story !== false }); render(); }
  }, () => {});
  if (db) {
    S.db = db; S.mode = "db";
    const timer = setTimeout(() => { if (!S.loaded) { S.slow = true; render(); } }, 10000);
    db.collection("words").onSnapshot(snap => {
      S.words = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      sweepVowels(); sweepConj();
      if (!snap.metadata.fromCache) { S.loaded = true; S.slow = false; clearTimeout(timer); }
      else if (S.words.length) S.loaded = true;
      render();
    }, err => { clearTimeout(timer); S.loaded = true; S.dbError = err.code; render(); });
  } else {
    S.words = ls.get("kesher-words") || [];
    S.loaded = true; render(); sweepVowels(); sweepConj();
  }
}

/* ---------- derived ---------- */
const isDue = (w) => (w.due ?? 0) <= now();
function stats() {
  const due = S.words.filter(isDue).length;
  const strong = S.words.filter(w => (w.box ?? 1) >= 4).length;
  return { total: S.words.length, due, strong };
}

/* ---------- render ---------- */
// Re-rendering replaces #main, so carry over what the person was typing and where the cursor was.
function render() {
  const keep = {};
  document.querySelectorAll("#main input[id], #main textarea[id], #main select[id]").forEach(el => { if (el.type !== "checkbox" && el.type !== "file" && el.id !== "v-text" && el.id !== "l-answer" && el.id !== "t-about" && el.id !== "f-search") keep[el.id] = el.value; });
  const act = document.activeElement; const actId = act?.id; let sel = null;
  try { sel = act && "selectionStart" in act ? [act.selectionStart, act.selectionEnd] : null; } catch {}
  renderInner();
  for (const [id, v] of Object.entries(keep)) { const el = document.getElementById(id); if (el) el.value = v; }
  if (actId) { const el = document.getElementById(actId); if (el && el !== document.activeElement) { el.focus(); try { if (sel) el.setSelectionRange(sel[0], sel[1]); } catch {} } }
}
function renderInner() {
  const st = stats();
  $("#stats").innerHTML = `<span><b>${st.total}</b> words</span><span><b>${st.due}</b> due</span><span><b>${st.strong}</b> strong</span>`;
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  const m = $("#main");
  if (!S.loaded) { m.innerHTML = `<div class="empty">${S.slow ? "Can't reach your saved words yet. Check your connection." : "Loading your words…"}</div>`; return; }
  const top = S.dbError ? `<div class="banner">Your saved words couldn't load (${esc(S.dbError)}). Reload the page to try again.</div>` : "";
  m.innerHTML = top + (S.tab === "cards" ? viewCards() : S.tab === "sentences" ? viewSentences() : S.tab === "listen" ? viewListen() : S.tab === "verbs" ? viewVerbs() : viewWords());
}

function emptyState(msg) {
  return `<div class="panel empty"><span class="he" lang="he">אֵין מִלִּים עֲדַיִן</span>${msg}<div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-act="goto" data-tab="words">Add your first words</button></div><p class="note" style="margin-top:12px">You can also tell Claude in chat which words to add.</p></div>`;
}

/* ---------- flashcards ---------- */
function viewCards() {
  if (!S.words.length) return emptyState("No words yet. Add some and your flashcards will show up here.");
  const s = S.session;
  const dirSeg = `<div class="seg" role="group" aria-label="Card direction">
      <button data-act="dir" data-v="he-en" aria-pressed="${S.dir === "he-en"}">עברית → English</button>
      <button data-act="dir" data-v="en-he" aria-pressed="${S.dir === "en-he"}">English → עברית</button></div>`;
  if (!s) {
    const st = stats();
    return `<div><h2>Flashcards</h2><p class="sub">Words you get right come back less often. Words you miss come back soon.</p></div>
      <div class="panel" style="display:flex;flex-direction:column;gap:14px">
        ${dirSeg}
        <div class="row">
          <button class="btn primary" data-act="start" data-v="due" ${st.due ? "" : "disabled"}>Review ${st.due} due word${st.due === 1 ? "" : "s"}</button>
          <button class="btn" data-act="start" data-v="all">Practice all ${st.total}</button>
          <button class="btn" data-act="start" data-v="weak">Weakest 10</button>
        </div>
        ${st.due ? "" : `<p class="note">Nothing due right now. Practice anyway, or try the Sentences tab.</p>`}
      </div>`;
  }
  if (!s.queue.length) {
    return `<div class="panel empty"><span class="he" lang="he">כָּל הַכָּבוֹד!</span>Session done: ${s.right} of ${s.done} right on the first try.
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-act="goto" data-tab="sentences">Use these words in sentences</button><button class="btn" data-act="end">Back</button></div></div>`;
  }
  const w = S.words.find(x => x.id === s.queue[0]);
  if (!w) { s.queue.shift(); return viewCards(); }
  const pct = Math.round(100 * s.done / (s.done + s.queue.length));
  const heFirst = S.dir === "he-en";
  const front = heFirst
    ? `<div class="big he" lang="he">${esc(w.he)}</div>`
    : `<div class="big en">${esc(w.en)}</div>`;
  const back = s.flipped ? `<div class="back">
      ${heFirst ? `<div class="en">${esc(w.en)}</div>` : `<div class="he" lang="he">${esc(w.he)}</div>`}
      ${w.tr ? `<div class="tr">${esc(w.tr)}</div>` : ""}
      ${w.note ? `<div class="note">${esc(w.note)}</div>` : ""}
    </div>` : `<div class="hint">Tap or press space to flip</div>`;
  return `<div class="row" style="justify-content:space-between">${dirSeg}<button class="btn small" data-act="end">End session</button></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="card" data-act="flip" role="button" tabindex="0" aria-label="Flip card">
      ${w.pos ? `<div class="pos">${esc(w.pos)}</div>` : ""}
      ${front}
      ${(heFirst || s.flipped) && canSpeak() ? `<button class="speak" data-act="say" data-id="${w.id}" aria-label="Hear it">${SPEAK_ICON}</button>` : ""}
      ${back}
    </div>
    ${s.flipped ? `<div class="answer-row"><button class="btn bad" data-act="grade" data-v="0">Missed it<kbd>1</kbd></button><button class="btn good" data-act="grade" data-v="1">Got it<kbd>2</kbd></button></div>` : ""}
    <p class="note" style="text-align:center">${s.queue.length} left in this session</p>`;
}

function startSession(kind) {
  let ids;
  if (kind === "due") ids = S.words.filter(isDue).sort((a, b) => (a.due ?? 0) - (b.due ?? 0)).map(w => w.id);
  else if (kind === "weak") ids = shuffle(S.words).sort((a, b) => (a.box ?? 1) - (b.box ?? 1)).slice(0, 10).map(w => w.id);
  else ids = shuffle(S.words).map(w => w.id);
  if (kind !== "due") ids = shuffle(ids);
  S.session = { queue: ids, done: 0, right: 0, flipped: false, missed: new Set() };
  render();
}

async function grade(ok) {
  const s = S.session; const id = s.queue.shift(); const w = S.words.find(x => x.id === id);
  s.flipped = false;
  if (!w) return render();
  if (ok) {
    if (!s.missed.has(id)) {
      s.done++; s.right++;
      const box = Math.min(5, (w.box ?? 1) + 1);
      store.patch(id, { box, due: now() + INTERVALS[box], seen: (w.seen ?? 0) + 1, right: (w.right ?? 0) + 1 }).catch(showErr);
    } else s.done++;
  } else {
    if (!s.missed.has(id)) {
      s.missed.add(id);
      store.patch(id, { box: 1, due: now() + INTERVALS[1], seen: (w.seen ?? 0) + 1 }).catch(showErr);
    }
    s.queue.splice(Math.min(3, s.queue.length), 0, id); // see it again in a few cards
  }
  render();
}

/* ---------- sentences ---------- */
function targetWords(f = S.sent.focus) {
  if (f === "pick") return S.words.filter(w => S.sent.picked.has(w.id));
  if (f === "due") { const d = S.words.filter(isDue); if (d.length) return shuffle(d).slice(0, 8); }
  if (f === "weak") return shuffle(S.words).sort((a, b) => (a.box ?? 1) - (b.box ?? 1)).slice(0, 8);
  return shuffle(S.words).slice(0, 8);
}

function viewSentences() {
  if (!S.words.length) return emptyState("Add a few words and Claude will write practice sentences with them.");
  const t = S.sent;
  const chips = t.focus === "pick" ? `<div class="chips">${S.words.map(w => `<button class="chip" data-act="pick" data-id="${w.id}" aria-pressed="${t.picked.has(w.id)}"><span class="he" lang="he">${esc(w.he)}</span><span>${esc(w.en)}</span></button>`).join("")}</div>` : "";
  const controls = `<div class="panel" style="display:flex;flex-direction:column;gap:14px">
      <div class="row" style="gap:18px">
        <div><label class="lbl">Level</label><div class="seg" role="group">
          ${[["beginner", "Beginner"], ["simple", "Everyday"], ["intermediate", "Intermediate"]].map(([v, l]) => `<button data-act="level" data-v="${v}" aria-pressed="${t.level === v}">${l}</button>`).join("")}</div></div>
        <div><label class="lbl">Focus on</label><div class="seg" role="group">
          ${[["due", "Due words"], ["weak", "Weakest"], ["mix", "Random"], ["pick", "I'll choose"]].map(([v, l]) => `<button data-act="focus" data-v="${v}" aria-pressed="${t.focus === v}">${l}</button>`).join("")}</div></div>
      </div>
      ${chips}
      ${viewInterests()}
      <div class="row">
        <button class="btn primary" data-act="gen" ${t.busy || !S.sample || (t.focus === "pick" && !t.picked.size) ? "disabled" : ""}>${t.busy ? "Writing sentences…" : t.items.length ? "Write new sentences" : "Write 6 sentences"}</button>
        ${t.busy ? `<button class="btn" data-act="stop">Stop</button>` : ""}
      </div>
      ${!S.sample ? `<p class="note">Sentence writing uses Claude, which is only available when you open this page on claude.ai.</p>` : ""}
      ${t.error ? `<div class="banner">${esc(t.error)}</div>` : ""}
    </div>`;
  let list = "";
  if (t.items.length) {
    list = `<div class="row" style="justify-content:space-between"><h2>Practice</h2><button class="btn small" data-act="nikud" aria-pressed="${S.nikud}">${S.nikud ? "Hide nikud" : "Show nikud"}</button><div class="seg" role="group" aria-label="Practice mode">
        <button data-act="smode" data-v="read" aria-pressed="${t.mode === "read"}">Read</button>
        <button data-act="smode" data-v="blank" aria-pressed="${t.mode === "blank"}">Fill the blank</button>
        <button data-act="smode" data-v="translate" aria-pressed="${t.mode === "translate"}">Translate</button></div></div>
      <div class="panel">${t.title ? `<h3 class="story-title">${esc(t.title)}</h3>` : ""}${t.items.map((it, i) => sentenceHtml(it, i)).join("")}</div>`;
  }
  return `<div><h2>Sentences</h2><p class="sub">Claude writes new sentences using your words, so you see them in real context. Highlighted words are from your list.</p></div>${controls}${list}`;
}

// Which version of the sentence to show: with nikud (when Claude gave one) or without
const heText = (it) => (S.nikud && it.heN ? it.heN : it.he);
// Speech reads better with the vowels in
const heSpoken = (it) => (it.heN || it.he).replace(/[\[\]]/g, "");
// "he" marks the learner's words with [brackets]
function heHtml(raw, blankFirst) {
  let first = true;
  return esc(raw).replace(/\[([^\]]+)\]/g, (_, w) => {
    if (blankFirst && first) { first = false; return `<span class="blank">&nbsp;</span>`; }
    return `<mark>${w}</mark>`;
  });
}

function sentenceHtml(it, i) {
  const t = S.sent; const mode = t.mode;
  const blank = mode === "blank" && !it.picked;
  const hide = mode === "translate" && !it.shown;
  const heLine = hide
    ? `<div class="en" style="flex:1;font-size:19px">${esc(it.en)}</div>`
    : `<div class="he" lang="he">${heHtml(heText(it), blank)}</div>`;
  const speak = canSpeak() && !hide && !blank ? `<button class="speak" data-act="saysent" data-i="${i}" aria-label="Hear sentence">${SPEAK_ICON}</button>` : "";
  let extra = "";
  if (mode === "blank") {
    extra = `<div class="opts">${it.options.map(o => {
      const cls = it.picked ? (strip(o) === strip(it.answer) ? "right" : o === it.picked ? "wrong" : "") : "";
      return `<button class="btn ${cls}" data-act="choose" data-i="${i}" data-v="${esc(o)}" ${it.picked ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>`;
    if (it.picked) extra += reveal(it);
  } else if (mode === "translate") {
    extra = it.shown ? reveal(it, true) : `<div class="row" style="justify-content:flex-end"><span class="note">Say it in Hebrew, then check.</span><button class="btn small" data-act="show" data-i="${i}">Show Hebrew</button></div>`;
  } else {
    extra = it.shown ? reveal(it) : `<div class="row" style="justify-content:flex-end"><button class="btn small" data-act="show" data-i="${i}">Show meaning</button></div>`;
  }
  return `<div class="sentence">${it.topic ? `<span class="topic">${esc(it.topic)}</span>` : ""}<div class="line">${speak}${heLine}</div>${extra}</div>`;
}
function reveal(it, skipEn) {
  return `<div class="reveal">${it.tr ? `<div class="tr">${esc(it.tr)}</div>` : ""}${skipEn ? "" : `<div>${esc(it.en)}</div>`}${it.grammar ? `<div class="gram">${esc(it.grammar)}</div>` : ""}</div>`;
}

let genCtl = null;
const SAMPLE_ERR = {
  not_granted: "This needs your OK to use Claude. Reload the page and allow it to try again.",
  rate_limited: "Too many requests just now. Wait a minute and try again.",
  invalid_json: "Claude's answer came back garbled. Try again.",
};
async function generate() {
  const t = S.sent; const targets = targetWords();
  if (!targets.length || !S.sample) return;
  t.busy = true; t.error = ""; render();
  genCtl = new AbortController();
  try {
    t.items = await fetchSentences(targets, t.level, genCtl.signal); t.title = S.lastTitle;
    if (!t.items.length) t.error = "Claude's answer didn't contain any sentences. Try again.";
  } catch (e) {
    if (e?.code !== "cancelled") t.error = SAMPLE_ERR[e?.code] || "Couldn't write sentences right now. Try again in a moment.";
  } finally { t.busy = false; genCtl = null; render(); }
}

// Asks Claude for 6 sentences built from the learner's words; [brackets] mark their words.
async function fetchSentences(targets, level, signal) {
  const vocab = S.words.map(w => `${w.he} = ${w.en}${w.pos ? ` (${w.pos})` : ""}`).join("\n");
  const focus = targets.map(w => `${w.he} = ${w.en}`).join("\n");
  const levelText = {
    beginner: "Very short sentences (3-6 words), present tense, simple structure.",
    simple: "Everyday sentences (5-10 words). Present, past or future tense are fine.",
    intermediate: "Natural sentences (8-15 words). Mix tenses, use some connectors like כי, אבל, ש-.",
  }[level];
  const prompt = `You are a Hebrew tutor writing practice sentences for an English-speaking learner of modern Israeli Hebrew.

The learner's vocabulary list:
${vocab}

Focus words for this round (use each at least once across the set):
${focus}

Write 6 sentences. ${levelText}

${memoryRules(6)}

Rules:
- Build sentences mostly from the learner's vocabulary. You may add very common basic words (pronouns, את, של, ב-, ל-, ה-, זה, יש, אין, גם, מאוד, ו-) and a few simple everyday words when needed.
- Conjugate and inflect naturally (gender, number, tense, prefixes). The sentence must be correct, natural Israeli Hebrew.
- Each sentence uses at least one focus word, and every focus word appears somewhere in the set.
- Pack in as many of the learner's words as fit naturally: aim for 3 or more per sentence (focus words plus any others from the list). Efficiency matters, but never at the cost of a natural, clear sentence.
- Verbs: sometimes conjugate them (past, present or future; different persons, genders and numbers) and sometimes keep the infinitive (e.g. after רוצה, צריך, אוהב, אפשר, כדאי). Vary this across the set.
- In "he", wrap every word from the learner's list in square brackets, exactly as it appears in the sentence, including any attached prefix, e.g. "אני [אוכל] [תפוח] [בבית]". Write "he" WITHOUT nikud.
- "heN": the same sentence WITH full nikud (vowel marks), with the same square brackets around the same words.
- "answer" is the first bracketed word, exactly as written inside its brackets.
- "distractors": 3 other plausible Hebrew words or forms that do NOT fit that blank, preferably from the learner's list, no nikkud.
- "tr": transliteration in simple English letters.
- "grammar": one short plain-English note on a form that changed (e.g. "אכלתי = I ate, past tense of לאכול"), or "" if nothing notable.
- "topic": the topic of the sentence in 1-3 English words.

Reply with only JSON like:
{"title":"${S.prefs.story ? "The Hummus Emergency" : ""}","sentences":[{"he":"אני [אוכל] [תפוח]","heN":"אֲנִי [אוֹכֵל] [תַּפּוּחַ]","tr":"ani okhel tapuakh","en":"I eat an apple.","answer":"אוכל","distractors":["שותה","הולך","ספר"],"grammar":"","topic":"vegan food"}]}`;
  const out = await S.sample.json(prompt, { signal, cache: false });
  const arr = Array.isArray(out) ? out : Array.isArray(out?.sentences) ? out.sentences : [];
  S.lastTitle = S.prefs.story && typeof out?.title === "string" ? out.title : "";
  return arr.filter(x => x && typeof x.he === "string" && typeof x.en === "string").map(x => {
    const answer = String(x.answer || (x.he.match(/\[([^\]]+)\]/) || [])[1] || "");
    const dis = (Array.isArray(x.distractors) ? x.distractors.map(String) : []).filter(d => strip(d) !== strip(answer));
    while (dis.length < 3) { const r = S.words[Math.floor(Math.random() * S.words.length)]; const c = strip(r.he); if (c !== strip(answer) && !dis.includes(c)) dis.push(c); if (S.words.length < 4) break; }
    return { he: x.he, heN: typeof x.heN === "string" && x.heN.includes("[") ? x.heN : "", tr: String(x.tr || ""), en: x.en, grammar: String(x.grammar || ""), topic: String(x.topic || ""), answer, options: shuffle([answer, ...dis.slice(0, 3)]), shown: false, picked: null };
  });
}

// Finds the list word a bracketed form came from (forms may carry prefixes or endings)
function wordForForm(form) {
  const a = strip(form).trim();
  // A conjugated verb (ביקרה) belongs to its infinitive (לבקר): check the conjugation tables, ignoring vav/yod spelling differences
  const loose = (h) => strip(h).replace(/[וי]/g, "").trim();
  const la = loose(a);
  for (const w of S.words) { const c = conjFor(w); if (c && c.forms.some(f => { const lf = loose(f.he); return lf === la || (lf.length > 2 && la.endsWith(lf)); })) return w; }
  return S.words.find(w => strip(w.he).trim() === a) || S.words.find(w => { const b = strip(w.he).trim(); return b.length > 1 && (a.includes(b) || b.includes(a)); });
}

/* ---------- verbs: conjugation tables and practice ---------- */
const TENSES = [["present", "Present"], ["past", "Past"], ["future", "Future"], ["imperative", "Command"]];
const TENSE_LABEL = Object.fromEntries(TENSES);
const isVerb = (w) => w && (String(w.pos || "").toLowerCase() === "verb" || /^to\s/i.test(String(w.en || "").trim()));
const verbList = () => S.words.filter(isVerb).sort((a, b) => (a.added ?? 0) - (b.added ?? 0));
// A table belongs to the word as spelled when it was made; a spelling change makes a new one
const conjFor = (w) => { const c = S.conj[w.id]; return c && Array.isArray(c.forms) && c.src === strip(w.he).trim() ? c : null; };

// Same memory rules as the main sentences, shared by every sentence prompt
function memoryRules(n) {
  const picked = S.prefs.topics.filter(t => !S.prefs.off.includes(t));
  const topics = (picked.length ? shuffle(picked) : DEFAULT_TOPICS).join(", ");
  const about = S.prefs.about.trim() || "an adult learner who loves animals, nature and travel, and eats vegan.";
  return `MAKE THEM MEMORABLE. Use these techniques from memory research:
- Self-reference: the learner is the main character. Write in first person ("I", "we") or address them as "you". About the learner: ${about}
- Personal interest: set the sentences in these topics, a different one per sentence where possible: ${topics}.
- Vivid and concrete: things you can picture, hear, smell or taste. Name specific places (a real trail, country or city), specific plant-based dishes, specific animals, colors and sounds. Make the learner's words act on each other inside one scene (the dog steals the hummus), not just sit side by side. Avoid flat, abstract or textbook lines like "The man has a book."
- Emotion and humor: give most sentences a feeling, a small surprise or a gentle joke. Make 1 or 2 of the ${n} playful or a bit absurd; odd images stand out most when mixed in with normal ones.
- ${S.prefs.story ? `Story: link the ${n} sentences into one short story in order, with a beginning, a small problem and a happy ending. Give it a short English title.` : "Distinct scenes: each sentence stands alone in a clearly different setting."}
- Values: food is always vegan; animals are respected and never eaten, hunted or harmed.
- Politics and world issues: keep them real and current-feeling (elections, the Knesset, climate policy, animal-welfare laws, water, housing, tech), factual and respectful. No slogans or put-downs of any group.
- Correctness and the level always come first. Never make a sentence harder just to make it fun.`;
}

let conjTimer = null; const conjTries = new Map();
function sweepConj() {
  clearTimeout(conjTimer);
  conjTimer = setTimeout(() => {
    if (!S.sample || !S.conjLoaded || S.conjPending.size >= 2) return; // two at a time
    const w = verbList().find(v => !conjFor(v) && !S.conjPending.has(v.id) && (conjTries.get(v.id) || 0) < 2);
    if (!w) return;
    conjTries.set(w.id, (conjTries.get(w.id) || 0) + 1);
    genConj(w);
    sweepConj(); // fill the second slot
  }, 900);
}
async function genConj(w) {
  S.conjPending.add(w.id); render();
  const prompt = `Give the full conjugation of the modern Israeli Hebrew verb ${w.he} (${w.en}), as Israelis use it today.

Return exactly these forms, in this order, all with full nikud (vowel marks):
- present: m.s., f.s., m.pl., f.pl.
- past: אני, אתה, את, הוא, היא, אנחנו, אתם, אתן, הם, הן
- future: אני, אתה, את, הוא, היא, אנחנו, אתם, אתן, הם, הן (use the everyday spoken forms, e.g. אתן/הן = תְּבַקְּרוּ/יְבַקְּרוּ; put the formal -נָה form in "note")
- imperative: m.s., f.s., m.pl., f.pl.

For each form:
- "tense": present | past | future | imperative
- "p": the pronoun(s) with nikud. Present: "אֲנִי / אַתָּה / הוּא" for m.s., "אֲנִי / אַתְּ / הִיא" for f.s., "אֲנַחְנוּ / אַתֶּם / הֵם" for m.pl., "אֲנַחְנוּ / אַתֶּן / הֵן" for f.pl. Imperative: "(אַתָּה)", "(אַתְּ)", "(אַתֶּם)", "(אַתֶּן)".
- "g": "m", "f", or "" when it is the same for both (אני, אנחנו)
- "n": "s" or "p"
- "he": the verb form with full nikud
- "tr": simple transliteration
- "en": short English, e.g. "I visited", "you (f.) will visit", "they (f.) visit", "Visit! (to a woman)"
- "note": "" unless something is worth knowing

Also classify the verb:
- "binyan": one of pa'al, nif'al, pi'el, pu'al, hif'il, huf'al, hitpa'el
- "gizra": the root type that most changes how this verb conjugates, one of: regular, pe-guttural (first root letter א/ה/ח/ע, or ר in nif'al), ayin-guttural (middle root letter א/ה/ח/ע), lamed-guttural (last root letter ח/ע), lamed-he (ends in ה), lamed-alef (ends in א), pe-nun (first letter נ that drops), pe-yod (first letter י), ayin-vav (hollow, middle ו/י), doubled (2nd and 3rd letters the same), four-letter, sibilant (hitpa'el with ס/שׁ/שׂ/צ/ז first, where the ת swaps)

If the word is not actually a verb, reply {"notVerb": true}.
Reply with only JSON: {"infinitive":"לְבַקֵּר","root":"ב-ק-ר","binyan":"pi'el","gizra":"regular","forms":[{"tense":"present","p":"אֲנִי / אַתָּה / הוּא","g":"m","n":"s","he":"מְבַקֵּר","tr":"mevaker","en":"I / you (m.) / he visit(s)","note":""}]}`;
  try {
    const out = await S.sample.json(prompt, { cache: false });
    if (out?.notVerb) { if (!w.pos) store.patch(w.id, { pos: "other" }).catch(() => {}); return; }
    const forms = (Array.isArray(out?.forms) ? out.forms : []).filter(f => f && f.he && TENSE_LABEL[f.tense]).map(f => ({
      tense: f.tense, p: String(f.p || ""), g: f.g === "m" || f.g === "f" ? f.g : "", n: f.n === "p" ? "p" : "s",
      he: String(f.he), tr: String(f.tr || ""), en: String(f.en || ""), note: String(f.note || ""),
    }));
    if (forms.length < 20) throw { code: "short" };
    const doc = { src: strip(w.he).trim(), infinitive: String(out.infinitive || w.he), root: String(out.root || ""), binyan: String(out.binyan || ""), gizra: GIZRA_KEYS.includes(out.gizra) ? out.gizra : "other", forms, made: now() };
    if (S.mode === "db") await S.db.collection("conj").doc(w.id).set(doc);
    else { S.conj[w.id] = doc; ls.set("kesher-conj", S.conj); }
  } catch (e) {
    S.conjErr = e?.code === "not_granted" ? "Building verb tables needs your OK to use Claude. Reload the page and choose Allow." : "";
  } finally { S.conjPending.delete(w.id); render(); sweepConj(); }
}

// Every form of the chosen verb(s) that passes the filters
function verbForms() {
  const V = S.verb;
  const verbs = selectedVerbs();
  const out = [];
  for (const w of verbs) {
    const c = conjFor(w); if (!c) continue;
    c.forms.forEach((f, i) => {
      if (!V.tenses.has(f.tense)) return;
      if (V.num !== "all" && f.n !== V.num) return;
      if (V.gen !== "all" && f.g && f.g !== V.gen) return;
      out.push({ ...f, key: w.id + "|" + i, verbId: w.id, inf: c.infinitive, verbEn: w.en });
    });
  }
  return out;
}
const formByKey = (k) => { const [id, i] = k.split("|"); const w = S.words.find(x => x.id === id); const c = w && conjFor(w); const f = c?.forms[+i]; return f ? { ...f, key: k, verbId: id, inf: c.infinitive, verbEn: w.en } : null; };
const whoLabel = (f) => f.tense === "present" || f.tense === "imperative"
  ? `${f.n === "s" ? "singular" : "plural"}${f.g ? ", " + (f.g === "m" ? "masculine" : "feminine") : ""}`
  : "";

/* ---------- verb types: binyan + root type ---------- */
// The pattern letters פ-ע-ל stand for the three root letters
const BINYANIM = [
  { key: "paal", name: "Pa'al", he: "פָּעַל", aka: "also called Kal", desc: "The basic, most common pattern: everyday actions like to write, to eat, to go.", pat: { inf: "לִפְעֹל", past: "פָּעַל", pres: "פּוֹעֵל", fut: "יִפְעֹל" } },
  { key: "nifal", name: "Nif'al", he: "נִפְעַל", desc: "Often the passive or 'happens to you' side of pa'al: to be written, to get hurt, to remember. Watch for the doubled middle letter in the future and infinitive.", pat: { inf: "לְהִפָּעֵל", past: "נִפְעַל", pres: "נִפְעָל", fut: "יִפָּעֵל" } },
  { key: "piel", name: "Pi'el", he: "פִּעֵל", desc: "Active, often more intense actions. The middle root letter is doubled (dagesh): to visit, to fix, to try.", pat: { inf: "לְפַעֵל", past: "פִּעֵל", pres: "מְפַעֵל", fut: "יְפַעֵל" } },
  { key: "pual", name: "Pu'al", he: "פֻּעַל", desc: "The passive of pi'el. It has no infinitive.", pat: { inf: "—", past: "פֻּעַל", pres: "מְפֻעָל", fut: "יְפֻעַל" } },

  { key: "hufal", name: "Huf'al", he: "הֻפְעַל", desc: "The passive of hif'il. It has no infinitive.", pat: { inf: "—", past: "הֻפְעַל", pres: "מֻפְעָל", fut: "יֻפְעַל" } },
  { key: "hitpael", name: "Hitpa'el", he: "הִתְפַּעֵל", desc: "Often reflexive or done to yourself: to get organized, to hide, to make an effort. Starts with הִתְ / מִתְ.", pat: { inf: "לְהִתְפַּעֵל", past: "הִתְפַּעֵל", pres: "מִתְפַּעֵל", fut: "יִתְפַּעֵל" } },

const GIZRA = [
  ["regular", "Regular", "שְׁלֵמִים", "All three root letters stay put in every form. This is the pattern exactly as shown above."],
  ["pe-guttural", "First letter guttural", "פ׳ גְּרוֹנִית", "The first root letter is א, ה, ח or ע (or ר in nif'al). It can't take a silent sheva, so it gets an 'a' or 'e' sound: לַעֲמֹד, יַעֲמֹד. In nif'al the vowel before it lengthens instead of doubling: לְהֵרָגַע."],
  ["ayin-guttural", "Middle letter guttural", "ע׳ גְּרוֹנִית", "The middle root letter is א, ה, ח or ע. Vowels shift around it in some forms: צָחֲקוּ, יִצְחֲקוּ, נִבְהֲלוּ."],
  ["lamed-guttural", "Ends in ח or ע", "ל׳ גְּרוֹנִית", "The last root letter is ח or ע, which pulls in an 'a' sound: לִשְׂמֹחַ, יִשְׂמַח, שׂוֹמֵחַ."],
  ["lamed-he", "Ends in ה", "ל״ה / ל״י", "The final ה turns into ת, ו or י in many forms: לִבְנוֹת, בָּנָה, בָּנִיתִי, בּוֹנֶה, יִבְנֶה."],
  ["lamed-alef", "Ends in א", "ל״א", "The final א goes silent and changes the vowel before it: לִמְצֹא, מָצָא, מוֹצֵא, יִמְצָא."],
  ["pe-nun", "First letter נ", "פ״נ", "The נ often drops out and doubles the next letter: לְהַצִּיל, מַצִּיל, יַצִּיל; לִנְסֹעַ, יִסַּע."],
  ["pe-yod", "First letter י", "פ״י", "The י often vanishes or turns into ו: לָשֶׁבֶת, יָשַׁב, יוֹשֵׁב, יֵשֵׁב."],
  ["ayin-vav", "Hollow: middle ו or י", "ע״ו / ע״י", "The middle letter mostly disappears: לָרוּץ, רָץ, רָץ, יָרוּץ."],
  ["doubled", "Doubled", "כְּפוּלִים", "The second and third root letters are the same: לָסֹב, סָבַב."],
  ["four-letter", "Four-letter root", "מְרֻבָּעִים", "Four root letters, found in pi'el, pu'al and hitpa'el: לְתַרְגֵּם, לְהִתְאַרְגֵּן."],
  ["sibilant", "Swap: starts with ס שׁ שׂ צ ז", "שִׂיכּוּל", "In hitpa'el the ת swaps places with the first root letter: לְהִשְׁתַּדֵּל (not לְהִתְשַׁדֵּל), לְהִצְטַלֵּם."],
  ["other", "Other", "", ""],

const GIZRA_KEYS = GIZRA.map(g => g[0]);
function normBinyan(s) {
  const t = String(s || "").toLowerCase().replace(/[^a-z]/g, "");
  if (t.startsWith("hitp")) return "hitpael";
  if (t.startsWith("huf") || t.startsWith("hof")) return "hufal";
  if (t.startsWith("hif")) return "hifil";
  if (t.startsWith("pu")) return "pual";
  if (t.startsWith("pi")) return "piel";
  if (t.startsWith("nif")) return "nifal";
  if (t.startsWith("pa") || t.startsWith("qal") || t.startsWith("kal")) return "paal";
  return "other";
}
function verbType(w) {
  const c = conjFor(w); if (!c) return { b: "pending", g: "other" };
  const g = GIZRA_KEYS.includes(c.gizra) ? c.gizra : "other";
  return { b: normBinyan(c.binyan), g };
}
// The forms shown side by side in the pattern view
function keyForms(c) {
  const fs = c.forms || [];
  const he3 = (t) => fs.find(f => f.tense === t && strip(f.p).trim() === "הוא");
  return { inf: c.infinitive, past: he3("past"), pres: fs.find(f => f.tense === "present" && f.g === "m" && f.n === "s"), fut: he3("future") };
}

  return `${intro}<div class="panel" style="display:flex;flex-direction:column;gap:14px">${chips}${modes}${filters}${err}</div>${body}`;
}

function verbTables() {
  const V = S.verb;
  const verbs = selectedVerbs();
  if (!verbs.length) return `<div class="panel empty">Pick at least one verb above.</div>`;
  return verbs.map(w => {

    const sections = TENSES.map(([t, label]) => {

}

function noForms() {

/* Flashcards for verb forms */
function verbCards() {
  const V = S.verb; const s = V.session; const forms = verbForms();
  if (!s) {
    if (!forms.length) return noForms();
    return `<div class="panel" style="display:flex;flex-direction:column;gap:12px">
      <div class="seg" role="group" aria-label="Card direction">
        <button data-act="vdir" data-v="make" aria-pressed="${V.dir === "make"}">Who + when → form</button>
        <button data-act="vdir" data-v="read" aria-pressed="${V.dir === "read"}">Form → who + when</button></div>
      <div class="row"><button class="btn primary" data-act="vcstart">Start ${forms.length} cards</button></div>

  }
  if (!s.queue.length) {

      ${missed.length ? `<div style="margin-top:12px;text-align:left"><b>Forms to look at again:</b><div class="chips" style="margin-top:6px">${missed.map(f => `<span class="chip"><span class="he" lang="he">${esc(f.he)}</span><span>${esc(f.en)}</span></span>`).join("")}</div></div>` : ""}
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-act="vcstart">Go again</button><button class="btn" data-act="vcend">Back</button></div></div>`;
  }
  const f = formByKey(s.queue[0]); if (!f) { s.queue.shift(); return verbCards(); }
  const tag = `<div class="pos">${TENSE_LABEL[f.tense]}${whoLabel(f) ? " · " + whoLabel(f) : ""}</div>`;
  const front = V.dir === "make"
    ? `${tag}<div class="he big" lang="he" style="font-size:clamp(30px,8vw,44px)">${esc(f.p)}</div><div class="en" style="font-size:20px">${esc(f.en)}</div>`
    : `<div class="big he" lang="he">${esc(f.he)}</div>`;
  const back = s.flipped
    ? `<div class="back">${V.dir === "make" ? `<div class="he" lang="he">${esc(f.he)}</div>` : `${tag}<div class="he" lang="he">${esc(f.p)}</div><div class="en">${esc(f.en)}</div>`}<div class="tr">${esc(f.tr)}</div><div class="note">from <span class="he" lang="he">${esc(f.inf)}</span> · ${esc(f.verbEn)}</div></div>`
    : `<div class="hint">${V.dir === "make" ? "Say the form out loud, then tap to check" : "Who is doing it, and when? Tap to check"}</div>`;
  const pct = Math.round(100 * s.done / (s.done + s.queue.length));
  return `<div class="row" style="justify-content:space-between"><span class="note">${s.queue.length} left</span><button class="btn small" data-act="vcend">End session</button></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="card" data-act="vflip" role="button" tabindex="0" aria-label="Flip card">${front}
      ${(s.flipped || V.dir === "read") && canSpeak() ? `<button class="speak" data-act="vsay" data-k="${f.key}" aria-label="Hear it">${SPEAK_ICON}</button>` : ""}${back}</div>
    ${s.flipped ? `<div class="answer-row"><button class="btn bad" data-act="vgrade" data-v="0">Missed it<kbd>1</kbd></button><button class="btn good" data-act="vgrade" data-v="1">Got it<kbd>2</kbd></button></div>` : ""}`;
}
function verbCardGrade(ok) {
  const s = S.verb.session; const k = s.queue.shift(); s.flipped = false;
  if (ok) { s.done++; if (!s.missed.has(k)) s.right++; }
  else { s.missed.add(k); s.queue.splice(Math.min(3, s.queue.length), 0, k); }
  render();
}

/* Pick the right form out of similar ones */
function makeQuiz() {
  const forms = shuffle(verbForms()).slice(0, 10);
  const items = forms.map(f => {
    const all = (formByKey(f.key) && conjFor(S.words.find(w => w.id === f.verbId)).forms) || [];
    const same = all.filter(x => x.he !== f.he && x.tense === f.tense);
    const other = all.filter(x => x.he !== f.he && x.tense !== f.tense);
    const pool = [...new Set([...shuffle(same), ...shuffle(other)].map(x => x.he))].slice(0, 3);
    return { key: f.key, options: shuffle([f.he, ...pool]), picked: null };
  });
  S.verb.quiz = { items, i: 0, right: 0 };
}
function verbQuiz() {
  const V = S.verb; const q = V.quiz;
  if (!q) {
    const n = verbForms().length; if (!n) return noForms();
    return `<div class="panel" style="display:flex;flex-direction:column;gap:12px"><p style="margin:0">You see who is doing it and when. Pick the right form from look-alikes of the same verb.</p>
      <div class="row"><button class="btn primary" data-act="vqstart">Start ${Math.min(10, n)} questions</button></div></div>`;
  }
  if (q.i >= q.items.length) return `<div class="panel empty"><span class="he" lang="he">${q.right >= q.items.length - 1 ? "מְצֻיָּן!" : "יֹפִי!"}</span>${q.right} of ${q.items.length} right.
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" data-act="vqstart">New round</button><button class="btn" data-act="vqend">Back</button></div></div>`;
  const it = q.items[q.i]; const f = formByKey(it.key); if (!f) { q.i++; return verbQuiz(); }
  return `<div class="row" style="justify-content:space-between"><span class="note">Question ${q.i + 1} of ${q.items.length}</span><button class="btn small" data-act="vqend">End</button></div>
    <div class="panel quiz">
      <div class="pos">${TENSE_LABEL[f.tense]}${whoLabel(f) ? " · " + whoLabel(f) : ""}</div>
      <div class="he" lang="he" style="font-size:30px">${esc(f.p)} ___</div>
      <div style="font-size:18px">${esc(f.en)}</div>
      <div class="opts" style="justify-content:center">${it.options.map(o => {
        const cls = it.picked ? (o === f.he ? "right" : o === it.picked ? "wrong" : "") : "";
        return `<button class="btn ${cls}" data-act="vqpick" data-v="${esc(o)}" ${it.picked ? "disabled" : ""}>${esc(o)}</button>`;
      }).join("")}</div>
      ${it.picked ? `<div class="reveal" style="text-align:center"><div class="tr">${esc(f.tr)}</div>${it.picked !== f.he ? `<div class="note">${esc(it.picked)} is a different person or tense.</div>` : ""}</div>
        <div class="row" style="justify-content:center">${canSpeak() ? `<button class="speak" data-act="vsay" data-k="${f.key}" aria-label="Hear it">${SPEAK_ICON}</button>` : ""}<button class="btn primary" data-act="vqnext">${q.i + 1 < q.items.length ? "Next" : "See score"}</button></div>` : ""}
    </div>`;
}

/* Sentences that each use a different form */
function verbSentences() {
  const V = S.verb; const t = V.sent; const forms = verbForms();
  if (!forms.length && !t.items.length) return noForms();
  const controls = `<div class="panel" style="display:flex;flex-direction:column;gap:12px">
      <p style="margin:0">Claude writes sentences about your interests, each using a different form of ${selectedVerbs().length === 1 ? "this verb" : "the verbs you picked"}, mixing singular and plural, masculine and feminine.</p>
      <div class="row"><button class="btn primary" data-act="vsgen" ${t.busy || !S.sample || !forms.length ? "disabled" : ""}>${t.busy ? "Writing sentences…" : t.items.length ? "Write new sentences" : "Write 8 sentences"}</button></div>
      ${!S.sample ? `<p class="note">Sentence writing uses Claude, which works when you open this page on claude.ai.</p>` : ""}
      ${t.error ? `<div class="banner">${esc(t.error)}</div>` : ""}</div>`;
  if (!t.items.length) return controls;
  const list = `<div class="row" style="justify-content:space-between"><h2>Practice</h2><button class="btn small" data-act="nikud">${S.nikud ? "Hide nikud" : "Show nikud"}</button><div class="seg" role="group" aria-label="Practice mode">
      ${[["read", "Read"], ["blank", "Fill the blank"], ["translate", "Translate"]].map(([v, l]) => `<button data-act="vsmode" data-v="${v}" aria-pressed="${t.mode === v}">${l}</button>`).join("")}</div></div>
    <div class="panel">${t.title ? `<h3 class="story-title">${esc(t.title)}</h3>` : ""}${t.items.map((it, i) => verbSentenceHtml(it, i)).join("")}</div>`;
  return controls + list;
}
function verbSentenceHtml(it, i) {
  const mode = S.verb.sent.mode;
  const blank = mode === "blank" && !it.picked; const hide = mode === "translate" && !it.shown;
  const heLine = hide ? `<div class="en" style="flex:1;font-size:19px">${esc(it.en)}</div>` : `<div class="he" lang="he">${heHtml(heText(it), blank)}</div>`;
  const speak = canSpeak() && !hide && !blank ? `<button class="speak" data-act="vssay" data-i="${i}" aria-label="Hear sentence">${SPEAK_ICON}</button>` : "";
  const label = it.label ? `<span class="topic">${esc(it.label)}</span>` : "";
  let extra;
  if (mode === "blank") {
    extra = `<div class="opts">${it.options.map(o => { const cls = it.picked ? (strip(o) === strip(it.answer) ? "right" : o === it.picked ? "wrong" : "") : ""; return `<button class="btn ${cls}" data-act="vschoose" data-i="${i}" data-v="${esc(o)}" ${it.picked ? "disabled" : ""}>${esc(o)}</button>`; }).join("")}</div>`;
    if (it.picked) extra += reveal(it);
  } else if (mode === "translate") {
    extra = it.shown ? reveal(it, true) : `<div class="row" style="justify-content:flex-end"><span class="note">Say it in Hebrew, then check.</span><button class="btn small" data-act="vsshow" data-i="${i}">Show Hebrew</button></div>`;
  } else extra = it.shown ? reveal(it) : `<div class="row" style="justify-content:flex-end"><button class="btn small" data-act="vsshow" data-i="${i}">Show meaning</button></div>`;
  return `<div class="sentence">${label}<div class="line">${speak}${heLine}</div>${extra}</div>`;
}
async function genVerbSentences() {
  const V = S.verb; const t = V.sent;
  const forms = shuffle(verbForms());
  // spread across tenses, numbers and genders: take a varied set of up to 8
  const pickedForms = []; const seen = new Set();
  for (const f of forms) { const k = f.verbId + f.tense + f.n + f.g; if (!seen.has(k)) { seen.add(k); pickedForms.push(f); } if (pickedForms.length >= 8) break; }
  for (const f of forms) { if (pickedForms.length >= 8) break; if (!pickedForms.includes(f)) pickedForms.push(f); }
  if (!pickedForms.length || !S.sample) return;
  t.busy = true; t.error = ""; render();
  const list = pickedForms.map((f, i) => `${i + 1}. ${strip(f.he)} = ${f.en} (${TENSE_LABEL[f.tense].toLowerCase()}${whoLabel(f) ? ", " + whoLabel(f) : ""})`).join("\n");
  const vocab = S.words.map(w => `${strip(w.he)} = ${w.en}`).join(", ");
  const n = pickedForms.length;
  const prompt = `You are a Hebrew tutor writing practice sentences for an English-speaking learner of modern Israeli Hebrew who is practising verb conjugation.

Write ${n} sentences. Sentence number k must use verb form number k from this list, exactly as given:
${list}

The subject must make the person, gender and number clear (use a pronoun or a clearly male/female/plural subject, e.g. "my sister", "the hikers"), so the learner can see why that form is used.
Keep sentences short to medium (5-12 words). Other words should be simple; the learner also knows: ${vocab}.

${memoryRules(n)}

Rules:
- Correct, natural Israeli Hebrew.
- In "he", wrap the practised verb form in square brackets, e.g. "אחותי [ביקרה] אותי בחיפה". Write "he" WITHOUT nikud.
- "heN": the same sentence WITH full nikud, with the same brackets.
- "form": the practised verb form, as in the list.
- "tr": simple transliteration. "en": natural English translation.
- "grammar": one short note on why this form fits (e.g. "בִּקְּרָה: past, she — the subject אחותי is feminine singular").

Reply with only JSON: {"title":"${S.prefs.story ? "A short title" : ""}","sentences":[{"he":"...","heN":"...","form":"...","tr":"...","en":"...","grammar":"..."}]}`;
  try {
    const out = await S.sample.json(prompt, { cache: false });
    const arr = Array.isArray(out?.sentences) ? out.sentences : Array.isArray(out) ? out : [];
    t.title = S.prefs.story && typeof out?.title === "string" ? out.title : "";
    t.items = arr.filter(x => x && typeof x.he === "string" && x.he.includes("[")).map((x, i) => {
      // Match by the form Claude says it used (spellings can differ, so compare without vowels or vav/yod), else by position
      const loose = (h) => strip(h).replace(/[וי]/g, "");
      const f = pickedForms.find(p => x.form && loose(p.he) === loose(x.form)) || pickedForms[i] || pickedForms[0];
      // Choices all come from the table, with nikud, so the spelling never gives the answer away
      const answer = f.he;
      const c = conjFor(S.words.find(w => w.id === f.verbId));
      const same = c ? c.forms.filter(o => o.tense === f.tense && o.he !== f.he).map(o => o.he) : [];
      const rest = c ? c.forms.filter(o => o.he !== f.he).map(o => o.he) : [];
      const dis = [...new Set([...shuffle(same), ...shuffle(rest)])].slice(0, 3);
      return { he: x.he, heN: typeof x.heN === "string" && x.heN.includes("[") ? x.heN : "", tr: String(x.tr || ""), en: String(x.en || ""), grammar: String(x.grammar || ""),
        label: `${TENSE_LABEL[f.tense]}${whoLabel(f) ? " · " + whoLabel(f) : ""}`, answer, options: shuffle([answer, ...dis]), shown: false, picked: null };
    });
    if (!t.items.length) t.error = "Claude's answer didn't contain any sentences. Try again.";
  } catch (e) { t.error = SAMPLE_ERR[e?.code] || "Couldn't write sentences right now. Try again in a moment."; }
  finally { t.busy = false; render(); }
}

function verbClick(a, el, v) {
  const V = S.verb;
  switch (a) {
    case "vsel": setSel([el.dataset.id], !isSel(el.dataset.id)); break;
    case "vselall": V.selAll = true; V.sel.clear(); V.session = null; V.quiz = null; saveVerbSel(); break;
    case "vselnone": V.selAll = false; V.sel.clear(); V.session = null; V.quiz = null; saveVerbSel(); break;
    case "vselgroup": { const ids = groupIds(el.dataset.b, el.dataset.g); setSel(ids, !ids.every(isSel)); break; }
    case "vmode": V.mode = v; V.session = null; V.quiz = null; break;
    case "vtense": { if (V.tenses.has(v)) { if (V.tenses.size > 1) V.tenses.delete(v); } else V.tenses.add(v); V.session = null; V.quiz = null; break; }
    case "vnum": V.num = v; V.session = null; V.quiz = null; break;
    case "vgen": V.gen = v; V.session = null; V.quiz = null; break;
    case "vdir": V.dir = v; if (V.session) V.session.flipped = false; break;
    case "vcstart": V.session = { queue: shuffle(verbForms().map(f => f.key)), done: 0, right: 0, flipped: false, missed: new Set() }; break;
    case "vcend": V.session = null; break;
    case "vflip": if (V.session) V.session.flipped = !V.session.flipped; break;
    case "vgrade": verbCardGrade(v === "1"); return;
    case "vqstart": makeQuiz(); break;
    case "vqend": V.quiz = null; break;
    case "vqpick": { const q = V.quiz; const it = q.items[q.i]; if (!it.picked) { it.picked = v; if (v === formByKey(it.key)?.he) q.right++; } break; }
    case "vqnext": V.quiz.i++; break;
    case "vsay": { const f = formByKey(el.dataset.k); if (f) say(f.he); return; }
    case "vsgen": genVerbSentences(); return;
    case "vsmode": V.sent.mode = v; V.sent.items.forEach(it => { it.shown = false; it.picked = null; }); break;
    case "vsshow": V.sent.items[+el.dataset.i].shown = true; break;
    case "vschoose": { const it = V.sent.items[+el.dataset.i]; if (it && !it.picked) { it.picked = v; it.shown = true; } break; }
    case "vssay": { const it = V.sent.items[+el.dataset.i]; if (it) say(heSpoken(it)); return; }
    default: return false;
  }
  render();
  return true;
}

          ${!r ? `<button class="mic small-mic ${S.dict ? "" : "off"} ${live ? "live" : ""}" data-act="lmic" aria-label="${live ? "Stop listening" : "Say your answer"}">${live ? STOP_ICON : MIC_ICON}</button>` : ""}
        </div>
        <div class="partial" id="l-partial">${live ? esc(S.listenPartial || "Listening… say your answer, then tap stop.") : ""}</div>
      </div>
      ${verdict}${r?.feedback ? `<p style="margin:0">${esc(r.feedback)}</p>` : ""}
      ${L.error ? `<div class="banner">${esc(L.error)}</div>` : ""}
      <div class="row">
        ${r ? `<button class="btn primary" data-act="lnext">${L.i + 1 < L.items.length ? "Next sentence" : "Finish round"}</button>`
            : `<button class="btn primary" data-act="lcheck" ${L.checking || live || !it.answer.trim() ? "disabled" : ""}>${L.checking ? "Checking…" : "Check my answer"}</button><button class="btn" data-act="lskip" ${L.checking ? "disabled" : ""}>I don't know</button>`}
      </div>
    </div>`;
}

async function startListening() {
  const L = S.listen; if (!S.sample) return;
  const targets = targetWords(L.focus);
  L.busy = true; L.error = ""; render();
  try {
    const items = await fetchSentences(targets, S.sent.level);
    L.items = items.map(x => ({ ...x, answer: "", result: null, showText: false }));
    L.i = 0; L.right = 0; L.close = 0;
    if (!L.items.length) L.error = "Claude's answer didn't contain any sentences. Try again.";
  } catch (e) { L.error = SAMPLE_ERR[e?.code] || "Couldn't write sentences right now. Try again in a moment."; }
  finally { L.busy = false; render(); }
}

function playCurrent(rate) {
  const it = S.listen.items[S.listen.i]; if (!it) return;
  say(heSpoken(it), rate);
}

async function checkListen(skip) {
  const L = S.listen; const it = L.items[L.i]; if (!it || it.result) return;
  const forms = [...it.he.matchAll(/\[([^\]]+)\]/g)].map(m => m[1]);
  if (skip) {
    it.result = { verdict: "wrong", feedback: "No problem. Listen again with the text showing, then try the next one.", missed: forms };
    applyListenResult(it); render(); return;
  }
  L.checking = true; L.error = ""; render();
  const prompt = `You are grading a listening-comprehension answer from an English-speaking learner of modern Israeli Hebrew. They heard the Hebrew sentence (they did not see it) and translated it into English. Their answer may come from speech-to-text, so ignore spelling, punctuation and small transcription slips.

Hebrew sentence: ${it.he.replace(/[\[\]]/g, "")}
Correct meaning: ${it.en}
The learner's vocabulary words in this sentence: ${forms.join(", ")}
Learner's answer: """${it.answer.trim()}"""

Judge the meaning, not word-for-word wording.
- "right": the meaning is fully correct (synonyms and natural rephrasing are fine).
- "close": the main idea is right but a detail is wrong or missing (tense, person, a word).
- "wrong": the meaning is mostly wrong or missing.
"feedback": 1-2 short, friendly sentences in plain English. Say specifically what they got right or which word they missed and what it means. No praise padding.
"missed": the vocabulary words from the list above (exactly as given) whose meaning they got wrong or left out. [] if none.

Reply with only JSON: {"verdict":"right","feedback":"...","missed":[]}`;
  try {
    const r = await S.sample.json(prompt, { cache: false, modelTier: "quick" });
    const verdict = ["right", "close", "wrong"].includes(r?.verdict) ? r.verdict : "close";
    it.result = { verdict, feedback: String(r?.feedback || ""), missed: Array.isArray(r?.missed) ? r.missed.map(String) : [] };
    applyListenResult(it);
  } catch (e) { L.error = SAMPLE_ERR[e?.code] || "Couldn't check your answer right now. Try again."; }
  finally { L.checking = false; render(); }
}
function applyListenResult(it) {
  const L = S.listen;
  if (it.result.verdict === "right") L.right++; else if (it.result.verdict === "close") L.close++;
  // Missed words go back into flashcard review
  const seen = new Set();
  for (const f of it.result.missed) {
    const w = wordForForm(f); if (!w || seen.has(w.id)) continue; seen.add(w.id);
    store.patch(w.id, { box: 1, due: now() }).catch(showErr);
  }
}

function choose(i, v) {
  const it = S.sent.items[i]; if (!it || it.picked) return;
  it.picked = v; it.shown = true;
  if (strip(v) !== strip(it.answer)) {
    // Missing it in context sends the word back for review
    const w = wordForForm(it.answer);
    if (w) store.patch(w.id, { box: 1, due: now() }).catch(showErr);
  }
  render();
}

      <div class="acts"><span class="boxes" title="Strength ${box} of 5">${dots}</span>${del}</div>

      ${S.vowelErr ? `<div class="banner" style="margin-bottom:8px">${esc(S.vowelErr)}</div>` : ""}
      ${S.words.length ? `<div class="wordlist">${rows || `<p class="note">No matches.</p>`}</div>` : `<p class="note">Your list is empty. Add words above, or tell Claude in chat which words to add.</p>`}

/* ---------- voice / free-form capture ---------- */
