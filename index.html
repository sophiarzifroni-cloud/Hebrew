// One microphone, two places to send words: the add-words box ("voice") or a listening answer ("listen")
function micErr(code, heMode) {
  return {
    not_granted: "The microphone is off for this page. Turn it on from the page's Permissions menu, or type instead.",
    unavailable: heMode ? "Hebrew voice input isn't available here. Switch to 'Speaking English' and say the Hebrew words as they sound." : "Voice input isn't available for your account here. You can type instead.",
    rate_limited: "The mic is busy right now. Try again in a moment.",
    upstream_error: "The mic or speech service had a problem. Try again.",
  }[code];
}
function setupDictation(d) {
  S.dict = d;
  d.onPartial(({ text }) => {
    if (S.dictTarget === "listen") { S.listenPartial = text; const p = $("#l-partial"); if (p) p.textContent = text || "Listening… say your answer, then tap stop."; }
    else { S.voice.partial = text; const p = $("#v-partial"); if (p) p.textContent = text; }
  });
  d.onFinal(({ text }) => {
    if (S.dictTarget === "listen") {
      const it = S.listen.items[S.listen.i]; if (!it || it.result) return;
      it.answer = it.answer ? it.answer + text : text.replace(/^\s+/, ""); S.listenPartial = "";
      const t = $("#l-answer"); if (t) t.value = it.answer;
      return;
    }
    const v = S.voice; v.text = v.text ? v.text + text : text.replace(/^\s+/, ""); v.partial = "";
    const t = $("#v-text"); if (t) { t.value = v.text; t.scrollTop = t.scrollHeight; }
    const p = $("#v-partial"); if (p) p.textContent = "";
  });
  d.onState(({ state, reason }) => {
    S.dictState = state;
    if (state === "idle") {
      const target = S.dictTarget; const v = S.voice;
      v.partial = ""; S.listenPartial = "";
      const heMode = target === "voice" && v.lang === "he";
      const why = micErr(reason, heMode);
      if (why) { if (target === "listen") S.listen.error = why; else v.error = why; }
      if (reason === "unavailable" && !heMode) S.dict = null;
      // Spoke new words and stopped: go straight to reading them
      if (target === "voice" && (reason === "stopped" || reason === "viewer_stopped") && v.text.trim() && S.sample && !v.busy) { parseVoice(); return; }
    }
    render();
  });
}

const IS_PHONE = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent || "");
function micClick(target) {
  const d = S.dict;
  if (!d) {
    const m = IS_PHONE
      ? "The page's own mic doesn't work in the phone app or mobile browsers. Tap the text box, then tap the mic key on your keyboard to speak. Claude reads it the same way."
      : "Voice input isn't available in this browser. Open this page in Chrome or Edge, or in the main window of the Claude desktop app. Or use your computer's dictation (Mac: press Fn twice; Windows: Win + H) in the box below.";
    if (target === "listen") S.listen.error = m; else S.voice.error = m;
    render();
    const box = $(target === "listen" ? "#l-answer" : "#v-text"); box?.focus();
    return;
  }
  if (d.active()) { const same = S.dictTarget === target; d.stop().catch(() => {}); if (same) return; }
  S.dictTarget = target;
  const heMode = target === "voice" && S.voice.lang === "he";
  const setErr = (m) => { if (target === "listen") S.listen.error = m; else S.voice.error = m; };
  setErr(""); if (target === "voice") S.voice.msg = "";
  // start() must run straight from the click
  d.start(heMode ? { language: "he" } : undefined).catch(e => {
    const m = micErr(e?.code, heMode) || (e?.code !== "stopped" && e?.code !== "dismissed" ? "Couldn't start the mic. Try again." : "");
    if (m) setErr(m);
    render();
  });
}

/* ---------- audio: Claude's voice if it speaks Hebrew, else the browser's Hebrew voice ---------- */
const canSpeak = () => !!(S.tts || S.webVoice);
async function setupAudio() {
  const pickWeb = () => { try { return speechSynthesis.getVoices().find(v => /^(he|iw)\b/i.test(v.lang)) || null; } catch { return null; } };
  let heOK = null;
  try { const langs = await S.tts?.languages?.(); if (Array.isArray(langs)) heOK = langs.some(l => /^(he|iw)\b/i.test(l)); } catch {}
  const update = () => {
    S.webVoice = pickWeb();
    S.preferWeb = heOK === false && !!S.webVoice;
    S.heWarn = heOK === false && !S.webVoice && !!S.tts;
    render();
  };
  update();
  try { speechSynthesis.addEventListener("voiceschanged", update); } catch {}
}
function webSay(text, rate) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.voice = S.webVoice; u.lang = S.webVoice.lang; u.rate = rate;
    speechSynthesis.speak(u); return true;
  } catch { return false; }
}
async function say(text, rate = 1) {
  if (S.webVoice && (S.preferWeb || !S.tts)) { webSay(text, rate); return; }
  if (!S.tts) return;
  try { await S.tts.speak(text, { language: "he", rate }); }
  catch (e) {
    if (e?.code === "not_granted") { S.tts = null; render(); }
    if (!["stopped", "replaced", "viewer_stopped", "busy", "rate_limited"].includes(e?.code) && S.webVoice) webSay(text, rate);
  }
}

/* ---------- scan a page ---------- */
// Shrink big phone photos so they upload fast and fit the size limit; text stays sharp at 2000px
async function shrinkPhoto(file, types) {
  try {
    if (file.size < 1.5e6 && types.includes(file.type)) return file;
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.88));
  } catch { return file; }
}
async function scanPhotos(fileList) {
  const v = S.voice; const files = [...(fileList || [])].filter(f => f.type.startsWith("image/"));
  if (!files.length || !S.sample) return;
  const lim = await S.sample.limits?.().catch(() => null);
  if (!lim?.images) { v.error = "Reading photos isn't available here. Open this page on claude.ai in a browser or the Claude app."; render(); return; }
  const types = lim.images.mediaTypes || ["image/jpeg", "image/png"];
  const max = lim.images.maxCount || 1;
  v.busy = true; v.error = ""; v.msg = ""; v.scanMsg = `Reading ${files.length > 1 ? files.length + " photos" : "your photo"}…`; render();
  const blobs = [];
  for (const f of files.slice(0, max)) blobs.push(await shrinkPhoto(f, types));
  const prompt = `The attached photo${blobs.length > 1 ? "s show" : " shows"} a page from someone learning modern Israeli Hebrew: a vocabulary list, notes, a worksheet or a textbook page. It may be handwritten or printed, and may already include English meanings or transliterations.

Pull out every Hebrew vocabulary word or short phrase the learner would want to study. Skip page numbers, instructions, dates, names and full example sentences (but do take the key word out of a sentence if it is clearly the word being taught). Do not invent words that are not on the page.
For each item:
- "he": the Hebrew in Hebrew script WITH full nikud (vowel marks). If handwriting is unclear, choose the real Hebrew word that best fits the letters and any meaning written next to it.
- "en": the English meaning. Use the one written on the page if there is one (fix spelling), otherwise give the common meaning.
- "tr": simple transliteration (e.g. "kelev").
- "pos": noun, verb, adjective, adverb, phrase or other.
- "note": very short and useful: gender for nouns (m./f.) and plural if irregular; verbs in the infinitive unless the page shows a specific form. Add "unclear on the page" if you had to guess. "" if nothing useful.

Reply with only a JSON array, e.g. [{"he":"כֶּלֶב","en":"dog","tr":"kelev","pos":"noun","note":"m., pl. כְּלָבִים"}]`;
  try {
    const out = await S.sample.json(prompt, { images: blobs, cache: false });
    const found = (Array.isArray(out) ? out : []).filter(x => x && x.he && x.en).map(x => ({ he: String(x.he), en: String(x.en), tr: String(x.tr || ""), pos: String(x.pos || ""), note: String(x.note || "") }));
    v.items = v.items.concat(found); markDups();
    v.scanMsg = found.length ? `Found ${found.length} word${found.length === 1 ? "" : "s"}${files.length > max ? ` (read the first ${max} photos)` : ""}. Untick any you don't want, then add.` : "";
    if (!found.length) v.error = "Couldn't find any Hebrew words in that photo. Try a closer, well-lit shot with the page flat.";
  } catch (e) {
    v.scanMsg = "";
    v.error = {
      not_granted: "Reading photos needs your OK to use Claude. Reload the page and choose Allow.",
      images_unavailable: "Reading photos isn't available here. Open this page on claude.ai in a browser or the Claude app.",
      rate_limited: "Too many requests just now. Wait a minute and try again.",
      invalid_json: "Claude's answer came back garbled. Try the photo again.",
    }[e?.code] || "Couldn't read that photo. Try again, or try a clearer shot.";
  } finally { v.busy = false; render(); }
}

async function parseVoice() {
  const v = S.voice; const text = v.text.trim();
  if (!text) return;
  if (!S.sample) { // No Claude here: fall back to the simple "hebrew = english" parser
    v.items = text.split(/\n|,|;/).map(l => l.trim()).filter(Boolean).map(l => { const m = l.match(/^(.+?)\s*(?:=|\s[-–]\s|\smeans\s)\s*(.+)$/i); return m ? { he: m[1], en: m[2], tr: "", pos: "", note: "" } : null; }).filter(Boolean);
    markDups(); if (!v.items.length) v.error = "Write each word like: כלב = dog"; render(); return;
  }
  v.busy = true; v.error = ""; v.msg = ""; render();
  const prompt = `A learner of modern Israeli Hebrew dictated or typed new vocabulary for their word list. It may come from speech-to-text, so Hebrew words are often spelled out phonetically in English letters (e.g. "kelev means dog", "toda is thank you"), possibly misheard. It may also be in Hebrew script, or just an English word they want the Hebrew for ("add the word for apple"), or a mix.

Transcript:
"""
${text}
"""

Pull out every vocabulary item the learner meant to add. For each:
- "he": the correct Hebrew word in Hebrew script WITH full nikkud (vowel marks). Fix likely speech-recognition mistakes. If only English was given, use the most common modern Israeli Hebrew word for it.
- "tr": simple transliteration (e.g. "kelev", "khatul").
- "en": short English meaning as the learner gave it (fix spelling), add a common second meaning only if very useful.
- "pos": one of noun, verb, adjective, adverb, phrase, other.
- "note": very short, useful: gender for nouns (m./f.) and plural if irregular; verbs in infinitive unless they said a specific form. "" if nothing useful.
Ignore filler like "um", "okay", "next word". Do not invent words they didn't mention.

Reply with only a JSON array, e.g. [{"he":"כֶּלֶב","tr":"kelev","en":"dog","pos":"noun","note":"m., pl. כְּלָבִים"}]`;
  try {
    const out = await S.sample.json(prompt, { cache: false });
    v.items = (Array.isArray(out) ? out : []).filter(x => x && x.he && x.en).map(x => ({ he: String(x.he), en: String(x.en), tr: String(x.tr || ""), pos: String(x.pos || ""), note: String(x.note || "") }));
    markDups();
    if (!v.items.length) v.error = "Couldn't find any words in that. Try saying it like \"kelev means dog\".";
  } catch (e) {
    v.error = {
      not_granted: "Turning speech into words needs your OK to use Claude. Reload the page and allow it, or use the typing form below.",
      rate_limited: "Too many requests just now. Wait a minute and try again.",
      invalid_json: "Claude's answer came back garbled. Try again.",
    }[e?.code] || "Couldn't read your words right now. Try again in a moment.";
  } finally { v.busy = false; render(); }
}
function markDups() {
  const have = new Set(S.words.map(w => strip(w.he).trim()));
  const seen = new Set();
  for (const it of S.voice.items) { const k = strip(it.he).trim(); it.dup = have.has(k) || seen.has(k); it.on = !it.dup; seen.add(k); }
}
async function addVoiceItems() {
  const v = S.voice;
  const arr = v.items.filter(x => x.on).map(x => newWord(x.he, x.en, x.tr, x.pos, x.note));
  const r = await addWords(arr);
  v.items = []; v.text = ""; v.scanMsg = ""; v.msg = `Added ${r.added} word${r.added === 1 ? "" : "s"}.`;
  render();
}

function newWord(he, en, tr = "", pos = "", note = "") {
  return { id: uid(), he: he.trim(), en: en.trim(), tr: tr.trim(), pos, note: note.trim(), box: 1, due: now(), seen: 0, right: 0, added: now() };
}
async function addWords(arr) {
  const existing = new Set(S.words.map(w => strip(w.he)));
  const fresh = arr.filter(w => w.he && w.en && !existing.has(strip(w.he)));
  for (const w of fresh) { await store.put(w).catch(showErr); }
  sweepVowels(); // nikud gets added in the background
  return { added: fresh.length, skipped: arr.length - fresh.length };
}

// Nikud: Claude adds the vowel marks to any word typed without them
const hasNikud = (s) => /[\u05B0-\u05BC\u05C1\u05C2\u05C7]/.test(s || "");
// Any word without nikud, however it got in (typed, pasted, another device, an earlier failed try),
// gets picked up here: after every change to the list and on every page load. Two tries per word per visit.
let vowelTimer = null; const vowelTries = new Map();
function sweepVowels() {
  clearTimeout(vowelTimer);
  vowelTimer = setTimeout(() => {
    if (!S.sample) return;
    const todo = S.words.filter(w => !hasNikud(w.he) && !S.vowelPending.has(w.id) && (vowelTries.get(w.id) || 0) < 2);
    if (!todo.length) return;
    todo.forEach(w => vowelTries.set(w.id, (vowelTries.get(w.id) || 0) + 1));
    addVowels(todo);
  }, 700);
}
async function addVowels(list) {
  const todo = list.filter(w => w && w.he && !hasNikud(w.he) && !S.vowelPending.has(w.id));
  if (!todo.length || !S.sample) return;
  todo.forEach(w => S.vowelPending.add(w.id)); render();
  const rows = todo.map(w => `${w.id} | ${w.he} | ${w.en}`).join("\n");
  const prompt = `Add full nikud (vowel marks, including dagesh and shin/sin dots) to each Hebrew word or phrase from a learner's vocabulary list, as pronounced in modern Israeli Hebrew. Choose the vowels that match the English meaning given (e.g. ספר = book → סֵפֶר, but ספר = barber → סַפָּר).
Keep the same letters. Only if the word is clearly misspelled for that meaning, give the correct spelling with nikud and set "fixed": true.
Also give:
- "tr": simple transliteration in English letters (e.g. "kelev", "letapes").
- "pos": noun, verb, adjective, adverb, phrase or other.
- "note": very short and useful: gender for nouns (m./f.) and plural if irregular. "" if nothing.

Words (id | hebrew | english):
${rows}

Reply with only a JSON array: [{"id":"abc","he":"כֶּלֶב","tr":"kelev","pos":"noun","note":"m., pl. כְּלָבִים","fixed":false}]`;
  try {
    const out = await S.sample.json(prompt, { cache: false });
    for (const r of Array.isArray(out) ? out : []) {
      const w = S.words.find(x => x.id === r?.id) || todo.find(x => x.id === r?.id);
      if (!w || typeof r.he !== "string" || !hasNikud(r.he)) continue;
      const same = strip(r.he).trim() === strip(w.he).trim();
      if (!same && !r.fixed) continue;
      const p = { he: r.he.trim() };
      if (!w.tr && r.tr) p.tr = String(r.tr);
      if (!w.pos && r.pos) p.pos = String(r.pos);
      const extra = !same ? `Spelling fixed from ${w.he}.` : "";
      const note = [w.note || String(r.note || ""), extra].filter(Boolean).join(" ");
      if (note !== (w.note || "")) p.note = note;
      await store.patch(w.id, p).catch(() => {});
    }
  } catch (e) {
    S.vowelErr = e?.code === "not_granted"
      ? "Adding nikud needs your OK to use Claude. Reload the page and choose Allow, then it happens automatically."
      : "Couldn't add nikud just now. Trying again shortly.";
    if (e?.code !== "not_granted") setTimeout(() => { S.vowelErr = ""; sweepVowels(); }, 30000);
  } finally { todo.forEach(w => S.vowelPending.delete(w.id)); render(); }
}
function showErr(e) {
  const m = e?.code === "invalid_argument" ? "You can view this list but not change it." : e?.code === "quota_exceeded" ? "Your word list is full." : "Couldn't save that change. Check your connection and try again.";
  const el = $("#addMsg"); if (el) el.textContent = m; else { S.sent.error = m; render(); }
}


/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const tab = e.target.closest("nav.tabs button");
  if (tab) { S.tab = tab.dataset.tab; S.confirmDel = null; render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === "say" || a === "saysent") e.stopPropagation();
  if (a[0] === "v" && verbClick(a, el, v)) return;
  switch (a) {
    case "goto": S.tab = el.dataset.tab; if (S.tab !== "cards") S.session = null; render(); break;
    case "dir": S.dir = v; ls.set("kesher-prefs", { dir: S.dir, level: S.sent.level }); if (S.session) S.session.flipped = false; render(); break;
    case "start": startSession(v); break;
    case "end": S.session = null; render(); break;
    case "flip": if (S.session) { S.session.flipped = !S.session.flipped; render(); } break;
    case "grade": grade(v === "1"); break;
    case "say": { const w = S.words.find(x => x.id === el.dataset.id); if (w) say(w.he); break; }
    case "saysent": { const it = S.sent.items[+el.dataset.i]; if (it) say(heSpoken(it)); break; }
    case "level": S.sent.level = v; ls.set("kesher-prefs", { dir: S.dir, level: v }); render(); break;
    case "focus": S.sent.focus = v; render(); break;
    case "pick": { const id = el.dataset.id; S.sent.picked.has(id) ? S.sent.picked.delete(id) : S.sent.picked.add(id); render(); break; }
    case "gen": generate(); break;
    case "stop": genCtl?.abort(); break;
    case "smode": S.sent.mode = v; S.sent.items.forEach(it => { it.shown = false; it.picked = null; }); render(); break;
    case "show": S.sent.items[+el.dataset.i].shown = true; render(); break;
    case "choose": choose(+el.dataset.i, v); break;
    case "mic": micClick("voice"); break;
    case "lmic": micClick("listen"); break;
    case "vowels": S.vowelErr = ""; vowelTries.clear(); sweepVowels(); break;
    case "nikud": S.nikud = !S.nikud; ls.set("kesher-nikud", S.nikud); render(); break;
    case "hmic": S.tab = "words"; S.session = null; micClick("voice"); render(); window.scrollTo(0, 0); break;
    case "ttoggle": { const t = S.prefs.topics[+el.dataset.i]; S.prefs.off = S.prefs.off.includes(t) ? S.prefs.off.filter(x => x !== t) : S.prefs.off.concat(t); S.openInterests = true; savePrefs(); render(); break; }
    case "tdel": { const t = S.prefs.topics[+el.dataset.i]; S.prefs.topics = S.prefs.topics.filter(x => x !== t); S.prefs.off = S.prefs.off.filter(x => x !== t); S.openInterests = true; savePrefs(); render(); break; }
    case "tadd": { const inp = $("#t-new"); const t = (inp?.value || "").trim(); if (t && !S.prefs.topics.includes(t)) { S.prefs.topics = S.prefs.topics.concat(t); savePrefs(); } if (inp) inp.value = ""; S.openInterests = true; render(); break; }
    case "story": S.prefs.story = v === "1"; S.openInterests = true; savePrefs(); render(); break;
    case "lfocus": S.listen.focus = v; render(); break;
    case "lstart": startListening().then(() => { if (S.listen.items.length) playCurrent(1); }); break;
    case "lplay": playCurrent(+el.dataset.r || 1); break;
    case "ltext": S.listen.items[S.listen.i].showText = true; render(); break;
    case "lcheck": checkListen(false); break;
    case "lskip": if (S.dict?.active()) S.dict.stop().catch(() => {}); checkListen(true); break;
    case "lnext": S.listen.i++; S.listen.error = ""; render(); if (S.listen.i < S.listen.items.length) playCurrent(1); window.scrollTo(0, 0); break;
    case "lquit": if (S.dict?.active() && S.dictTarget === "listen") S.dict.stop().catch(() => {}); S.listen.items = []; S.listen.i = 0; render(); break;
    case "vlang": S.voice.lang = v; S.voice.error = ""; render(); break;
    case "vparse": parseVoice(); break;
    case "vclear": S.voice.text = ""; S.voice.msg = ""; render(); break;
    case "vdiscard": S.voice.items = []; render(); break;
    case "vadd": addVoiceItems(); break;
    case "askdel": S.confirmDel = el.dataset.id; render(); break;
    case "nodel": S.confirmDel = null; render(); break;
    case "del": if (S.mode === "db") S.db.collection("conj").doc(el.dataset.id).delete().catch(() => {}); else { delete S.conj[el.dataset.id]; ls.set("kesher-conj", S.conj); }
      store.remove(el.dataset.id).catch(showErr); S.confirmDel = null; render(); break;
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "addForm") return;
  e.preventDefault();
  const w = newWord($("#f-he").value, $("#f-en").value, $("#f-tr").value, $("#f-pos").value, $("#f-note").value);
  ["f-he", "f-en", "f-tr", "f-pos", "f-note"].forEach(id => { const el = $("#" + id); if (el) el.value = ""; });
  addWords([w]).then(r => { render(); const m = $("#addMsg"); if (m) m.textContent = r.added ? (hasNikud(w.he) ? `Added ${w.he}.` : `Added ${w.he}. Adding nikud…`) : `${w.he} is already in your list.`; $("#f-he")?.focus(); });
});
document.addEventListener("toggle", (e) => {
  if (e.target.classList?.contains("interests")) S.openInterests = e.target.open;
  if (e.target.classList?.contains("vchoose")) S.verb.openPicker = e.target.open;
}, true);
document.addEventListener("keydown", (e) => { if (e.target.id === "t-new" && e.key === "Enter") { e.preventDefault(); $('[data-act="tadd"]')?.click(); } });
document.addEventListener("change", (e) => {
  if (e.target.id === "v-cam" || e.target.id === "v-pic") { const fl = e.target.files; scanPhotos(fl).finally(() => { try { e.target.value = ""; } catch {} }); return; }
  const i = e.target.dataset?.vi; if (i == null) return;
  const it = S.voice.items[+i]; if (it) { it.on = e.target.checked; render(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "t-about") { S.prefs.about = e.target.value; savePrefs(); return; }
  if (e.target.id === "l-answer") {
    const it = S.listen.items[S.listen.i]; if (!it) return;
    const had = !!it.answer.trim(); it.answer = e.target.value;
    if (had !== !!it.answer.trim()) render();
    return;
  }
  if (e.target.id === "v-text") {
    const had = !!S.voice.text.trim(); S.voice.text = e.target.value;
    if (had !== !!S.voice.text.trim()) render(); // enable/disable the button
    return;
  }
  if (e.target.id === "f-search") { S.filter = e.target.value; const pos = e.target.selectionStart; render(); const s = $("#f-search"); s.focus(); s.setSelectionRange(pos, pos); }
});
document.addEventListener("keydown", (e) => {
  const vs = S.verb.session;
  if (S.tab === "verbs" && S.verb.mode === "cards" && vs?.queue.length && !/input|textarea|select/i.test(e.target.tagName)) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); vs.flipped = !vs.flipped; render(); }
    else if (vs.flipped && (e.key === "1" || e.key === "ArrowLeft")) verbCardGrade(false);
    else if (vs.flipped && (e.key === "2" || e.key === "ArrowRight")) verbCardGrade(true);
    return;
  }
  if (S.tab !== "cards" || !S.session?.queue.length || /input|textarea|select/i.test(e.target.tagName)) return;
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); S.session.flipped = !S.session.flipped; render(); }
  else if (S.session.flipped && (e.key === "1" || e.key === "ArrowLeft")) grade(false);
  else if (S.session.flipped && (e.key === "2" || e.key === "ArrowRight")) grade(true);
});

boot();
})();
</script>
